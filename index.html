<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap Display Property</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
<body>
    <div class="container">
        <h1> My School Day</h1>
        <div class="row">
            <div class="col-sm col-md col-lg-4">
                <img class="img-fluid" src="https://placehold.co/600x400?text=Morning\nClasses" alt="Morning classes">
                <div class="md-visible">
                    <p>Web Design</p>
                    <p>English</p>
                    <p>Algebra</p>
                </div>
            </div>
            <div class="col d-none d-lg-block col-lg-4">
                <img class="img-fluid" src="https://placehold.co/600x400?text=Lunch" alt="Morning classes">
                <p>Lunch</p>
            </div>
            <div class="col-sm col-md col-lg-4">
                <img class="img-fluid" src="https://placehold.co/600x400?text=Afternoon\nClasses" alt="Morning classes">
                <div class="md-visible">
                <p>Chemistry</p>
                <p>Study Hall</p>
                <p>Spanish</p>
                </div>
            </div>
        </div>
    </div>
    </body>
</html>
